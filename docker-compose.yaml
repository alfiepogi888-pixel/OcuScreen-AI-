version: "3.8"

services:
  api:
    image: oocuscreen/api:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./model:/app/model
      - ./frontend:/app/frontend
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=-1
    working_dir: /app
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000